<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | Group Study Management System</title>
  <meta name="description" content="Browse, create, and join subject-based study groups on your college platform." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navbar injected by renderNavbar() in api.js -->
  <div id="navbar"></div>
  <div id="toast-container"></div>

  <div class="page-container">

    <!-- ── Page Header ──────────────────────────────────────────────────── -->
    <div class="page-header">
      <h1>Student Dashboard</h1>
      <p class="text-muted">Create new study groups or join existing ones.</p>
    </div>

    <!-- ── Create Group Form ─────────────────────────────────────────────── -->
    <div class="card" style="margin-bottom:2rem;">
      <div class="section-header">
        <h2 class="section-title">➕ Create a New Study Group</h2>
      </div>

      <!-- Inline error for create form -->
      <div id="create-error"
           class="hidden"
           style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
                  color:#f87171;border-radius:8px;padding:0.65rem 1rem;
                  margin-bottom:1rem;font-size:0.875rem;">
      </div>

      <form id="create-group-form" style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="flex:1;min-width:180px;margin-bottom:0;">
          <label for="group-name">Group Name <span style="color:var(--danger)">*</span></label>
          <input
            id="group-name"
            type="text"
            placeholder="e.g. Advanced Calculus Study Circle"
            maxlength="100"
            required
          />
        </div>
        <div class="form-group" style="flex:1;min-width:150px;margin-bottom:0;">
          <label for="group-subject">Subject <span style="color:var(--danger)">*</span></label>
          <input
            id="group-subject"
            type="text"
            placeholder="e.g. Mathematics"
            maxlength="80"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary" style="height:42px;padding:0 1.5rem;">
          Create Group
        </button>
      </form>
    </div>

    <!-- ── My Groups ──────────────────────────────────────────────────────── -->
    <div style="margin-bottom:2rem;">
      <div class="section-header">
        <h2 class="section-title">📂 My Groups</h2>
      </div>
      <div id="my-groups-list">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ── All Groups ─────────────────────────────────────────────────────── -->
    <div>
      <div class="section-header">
        <h2 class="section-title">🌐 All Study Groups</h2>
        <!-- Client-side subject search -->
        <div class="search-bar">
          <input
            id="search-subject"
            type="text"
            class="search-input"
            placeholder="🔍 Search by name or subject…"
            aria-label="Search groups by subject"
          />
        </div>
      </div>

      <!-- Cards rendered by dashboard.js -->
      <div id="all-groups-grid" class="card-grid">
        <div class="loading"><div class="spinner"></div> Loading groups…</div>
      </div>
    </div>

  </div>

  <!-- Load api.js first (defines all helper functions used by dashboard.js) -->
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
