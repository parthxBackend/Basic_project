<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Group Study Management System</title>
  <meta name="description" content="Create a free account on Group Study Management System to join and create subject-based study groups." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">

  <!-- Toast container injected by JS -->
  <div id="toast-container"></div>

  <div class="auth-container">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">📚</div>
      <div class="auth-logo-text">StudyGroups</div>
    </div>

    <!-- Card -->
    <div class="form-card">
      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join your college's study community today.</p>

      <!-- Error box (hidden until needed) -->
      <div id="register-error"
           class="hidden"
           style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
                  color:#f87171;border-radius:8px;padding:0.75rem 1rem;
                  margin-bottom:1rem;font-size:0.875rem;">
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input
            id="reg-name"
            type="text"
            placeholder="e.g. Alice Johnson"
            autocomplete="name"
            maxlength="60"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input
            id="reg-email"
            type="email"
            placeholder="you@college.edu"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-password">Password <span style="color:var(--text-dim);font-weight:400;">(min 6 characters)</span></label>
          <input
            id="reg-password"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-role">I am a…</label>
          <select id="reg-role" required>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button
          id="register-btn"
          type="submit"
          class="btn btn-primary btn-block"
          data-label="Create Account"
        >
          Create Account
        </button>
      </form>
    </div>

    <p class="auth-footer">
      Already have an account? <a href="/login.html">Sign in</a>
    </p>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
