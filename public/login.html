<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Group Study Management System</title>
  <meta name="description" content="Sign in to Group Study Management System to access your study groups and message boards." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">

  <div id="toast-container"></div>

  <div class="auth-container">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">📚</div>
      <div class="auth-logo-text">StudyGroups</div>
    </div>

    <div class="form-card">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue to your study groups.</p>

      <!-- Error box -->
      <div id="login-error"
           class="hidden"
           style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
                  color:#f87171;border-radius:8px;padding:0.75rem 1rem;
                  margin-bottom:1rem;font-size:0.875rem;">
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input
            id="login-email"
            type="email"
            placeholder="you@college.edu"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="form-group">
          <label for="login-role">Logging in as…</label>
          <select id="login-role" required>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button
          id="login-btn"
          type="submit"
          class="btn btn-primary btn-block"
          data-label="Sign In"
        >
          Sign In
        </button>
      </form>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="/register.html">Create one</a>
    </p>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
